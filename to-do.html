<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly To-Do</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: rgb(171, 189, 146);
      font-family: "Elms Sans", system-ui, -apple-system, sans-serif;
    }

    .title-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-icon {
      width: 45px;
      height: 45px;
      object-fit: contain;
    }

    h1 {
      color: #ffffff;
      font-size: 2.2rem;
      margin: 0;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <div class="title-container">
    <img src="icon.png" alt="To-Do Icon" class="title-icon">
    <h1>Weekly To-Do</h1>
  </div>
</body>
</html>
